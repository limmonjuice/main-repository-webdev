<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utang App</title>
    <script src="js/main.js" defer></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <h1>Mga Sisingilin</h1>

      <div class="input-group">
        <input type="text" id="utanger" placeholder="Enter Name" />
        <input type="number" id="money" placeholder="Amount" min="1" />
      </div>

      <div>
        <button type="submit" id="add">Add to List</button>
      </div>

      <div>
        <button type="button" id="clear">Clear List</button>
      </div>

      <p id="errorMsg"></p>

      <ul id="nakautangs"></ul>
    </main>
  </body>
</html>
